<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#DFF3FF">
  <meta name="description" content="Materi belajar interaktif untuk anak SD kelas 1–3: berhitung, susun huruf, cocokkan gambar, serta kenal huruf dan angka.">
  <title>Belajar Ceria bersama Kancil</title>
  <link rel="icon" href="assets/images/kancil.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <img class="awan a1" src="assets/images/awan.svg" alt="">
    <img class="awan a2" src="assets/images/awan.svg" alt="">

    <div class="bar-atas beranda">
      <div class="wadah">
        <span style="flex:1"></span>
        <span class="pil-bintang" aria-label="Jumlah bintang">
          <img src="assets/icons/2b50.svg" alt=""><span data-bintang="total">0</span>
        </span>
        <button class="ikon-bulat" id="tombol-suara" type="button" aria-label="Matikan suara"></button>
      </div>
    </div>

    <div class="wadah hero-isi">
      <h1>Belajar <span>Ceria</span></h1>
      <div class="hero-kancil">
        <img class="maskot ayun" src="assets/images/kancil.svg" alt="Kancil, maskot Belajar Ceria">
        <button class="gelembung" type="button" data-ucap="Halo! Aku Kancil. Ayo pilih permainan dan belajar bersama!" style="border:none;cursor:pointer">
          Halo! Aku Kancil.<br>Ayo pilih permainan!
        </button>
      </div>
    </div>
  </header>

  <main class="wadah">
    <h2 class="sr-only">Pilih permainan</h2>
    <nav class="daftar-modul">
      <a class="kartu-modul berhitung" href="berhitung.html">
        <div class="gambar"><img src="assets/icons/1f34e.svg" alt=""></div>
        <div>
          <h2>Ayo Berhitung</h2>
          <p>Menghitung benda</p>
          <span class="bintang-kartu"><img src="assets/icons/2b50.svg" alt="Bintang"><span data-bintang="berhitung">0</span></span>
        </div>
      </a>
      <a class="kartu-modul huruf" href="susun-huruf.html">
        <div class="gambar"><img src="assets/icons/1f431.svg" alt=""></div>
        <div>
          <h2>Susun Huruf</h2>
          <p>Menyusun kata</p>
          <span class="bintang-kartu"><img src="assets/icons/2b50.svg" alt="Bintang"><span data-bintang="huruf">0</span></span>
        </div>
      </a>
      <a class="kartu-modul cocokkan" href="cocokkan.html">
        <div class="gambar"><img src="assets/icons/1f430.svg" alt=""></div>
        <div>
          <h2>Cocokkan</h2>
          <p>Mencari pasangan</p>
          <span class="bintang-kartu"><img src="assets/icons/2b50.svg" alt="Bintang"><span data-bintang="cocokkan">0</span></span>
        </div>
      </a>
      <a class="kartu-modul kenal" href="kenal-huruf.html">
        <div class="gambar"><img src="assets/icons/1f524.svg" alt=""></div>
        <div>
          <h2>Kenal Huruf</h2>
          <p>Huruf &amp; angka</p>
          <span class="bintang-kartu"><img src="assets/icons/2b50.svg" alt="Bintang"><span data-bintang="kenal">0</span></span>
        </div>
      </a>
    </nav>
  </main>

  <footer class="kaki">
    Untuk anak SD kelas 1–3 · <a href="kredit.html">Kredit &amp; lisensi</a>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
